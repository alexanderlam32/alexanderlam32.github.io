
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hobbies | Alexander Lam</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #243247;
      line-height: 1.6;
    }

    /* NAVIGATION - SAME AS PROJECTS PAGE */

    nav {
      background: #10233d;
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      color: white;
      font-size: 22px;
      font-weight: bold;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
    }

    .nav-links a {
      color: #e1e9f3;
      text-decoration: none;
      font-size: 15px;
    }

    .nav-links a:hover {
      color: #7db8ff;
    }

    /* PAGE HEADER - SAME AS PROJECTS PAGE */

    .page-header {
      background: linear-gradient(135deg, #10233d, #244a72);
      color: white;
      text-align: center;
      padding: 75px 20px;
    }

    .page-header h1 {
      font-size: clamp(36px, 5vw, 52px);
      margin: 0 0 12px;
    }

    .page-header p {
      font-size: 18px;
      margin: 0;
      color: #e1e9f3;
    }

    /* HOBBIES CONTAINER */

    .hobbies-container {
      max-width: 1400px;
      margin: 45px auto;
      padding: 0 25px;
    }

    /* LAVENDER SECTION HEADING */

    .hobby-heading {
      background: #f0effa;
      padding: 25px 30px;
      margin-bottom: 25px;
      border-radius: 5px;
      text-align: center;
    }

    .hobby-heading h2 {
      color: #10233d;
      font-size: 30px;
      margin: 0;
      text-transform: uppercase;
    }

    /* AUTOMOBILES 2x2 GALLERY */

    .hobby-gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 25px;
    }

    .gallery-item {
      margin: 0;
      min-width: 0;
      text-align: center;
    }

    .gallery-media {
      padding: 3px;
      background: #f0effa;
      height: 350px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gallery-media img,
    .gallery-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* DISPLAY ENTIRE EXHAUST PHOTO */

    .gallery-media img.exhaust-photo {
      object-fit: contain;
    }

    /* DISPLAY ENTIRE VIDEO */

    .gallery-media video {
      object-fit: contain;
      background: #000;
    }

    /* PHOTO AND VIDEO CAPTIONS */

    .gallery-caption {
      color: #243247;
      font-size: 16px;
      margin: 12px 5px 0;
      line-height: 1.6;
    }

    /* DIVIDERS BETWEEN HOBBIES */

    .hobby-divider {
      height: 3px;
      width: 100%;
      background: #10233d;
      border-radius: 3px;
      margin: 65px 0;
    }

    /* FOOTER - SAME AS PROJECTS PAGE */

    footer {
      background: #10233d;
      color: #dce7f5;
      text-align: center;
      padding: 25px 20px;
      font-size: 14px;
    }

    /* TABLET */

    @media (max-width: 900px) {
      .hobby-gallery {
        gap: 20px;
      }

      .gallery-media {
        height: 300px;
      }
    }

    /* MOBILE - SAME BREAKPOINT AS PROJECTS PAGE */

    @media (max-width: 700px) {
      nav {
        justify-content: center;
      }

      .nav-links {
        justify-content: center;
        gap: 14px;
      }

      .page-header {
        padding: 55px 20px;
      }

      .page-header p {
        font-size: 16px;
      }

      .hobbies-container {
        margin: 30px auto;
        padding: 0 15px;
      }

      .hobby-heading {
        padding: 20px;
      }

      .hobby-heading h2 {
        font-size: 24px;
      }

      .hobby-gallery {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .gallery-media {
        height: 260px;
      }

      .gallery-caption {
        font-size: 15px;
      }

      .hobby-divider {
        margin: 45px 0;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->

  <nav>
    <a href="index.html" class="logo">Alexander Lam</a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#about">About Me</a>
      <a href="projects.html">Projects</a>
      <a href="experience.html">Work Experience</a>
      <a href="hobbies.html">Hobbies</a>
      <a href="index.html#contact">Contact</a>
    </div>
  </nav>

  <!-- PAGE HEADER -->

  <header class="page-header">
    <h1>Beyond Engineering</h1>
  </header>

  <main class="hobbies-container">

    <!-- HOBBY 1: AUTOMOBILES -->

    <section class="hobby">

      <div class="hobby-heading">
        <h2>Automobiles</h2>
      </div>

      <div class="hobby-gallery">

        <!-- EXHAUST INSTALLATION PHOTO -->

        <figure class="gallery-item">
          <div class="gallery-media">
            <img
              src="Exhaust1.jpg"
              class="exhaust-photo"
              alt="Installing AWE Track cat-back exhaust on Nissan Z"
              loading="lazy">
          </div>

          <figcaption class="gallery-caption">
            Installing the AWE Track Catback Exhaust System
            on my Nissan Z
          </figcaption>
        </figure>

        <!-- EXHAUST WALKTHROUGH VIDEO -->

        <figure class="gallery-item">
          <div class="gallery-media">
            <video
              controls
              playsinline
              preload="metadata"
              aria-label="Nissan Z exhaust installation walkthrough">

              <source src="Exhaust2.mp4" type="video/mp4">

              Your browser does not support HTML5 video.
            </video>
          </div>

          <figcaption class="gallery-caption">
            Walkthrough of the finished exhaust install
          </figcaption>
        </figure>

        <!-- COLD AIR INTAKES -->

        <figure class="gallery-item">
          <div class="gallery-media">
            <img
              src="Intake.jpg"
              alt="AMS cold air intakes on Nissan Z"
              loading="lazy">
          </div>

          <figcaption class="gallery-caption">
            AMS Cold Air Intakes for the Z
          </figcaption>
        </figure>

        <!-- KAWASAKI NINJA 500 -->

        <figure class="gallery-item">
          <div class="gallery-media">
            <img
              src="Bike.jpg"
              alt="Kawasaki Ninja 500 motorcycle"
              loading="lazy">
          </div>

          <figcaption class="gallery-caption">
            My Ninja 500 I like riding around the city on
          </figcaption>
        </figure>

      </div>

    </section>

  </main>

  <!-- FOOTER -->

  <footer>
    <p>Alexander Lam | Mechanical Engineering</p>
    <p>University of Houston</p>
  </footer>

</body>
</html>
